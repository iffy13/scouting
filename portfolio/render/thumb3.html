/* ================= animations: build once, draw per frame ================= */
function charScene(build, cam, opt = {}) {
  const scene = new THREE.Scene(); lights(scene, opt.key, opt.rimA, opt.rimB, opt.k);
  const obj = build(); scene.add(obj);
  const camera = new THREE.PerspectiveCamera(cam.fov || 30, W / H, .1, 300); camera.position.set(...cam.pos); camera.lookAt(...cam.look);
  return { scene, camera, obj, render() { return renderPass(scene, camera); } };
}
function limbs(obj) { return obj.children.filter(c => c.isGroup); }
const ANIM = {
  async turntable(sp) {
    const bgc = document.createElement("canvas"); bgc.width = W; bgc.height = H; const save = ctx; 
    burst(640, 360, sp.burst[0], sp.burst[1], 26); const bg = ctx.getImageData(0, 0, W, H);
    const cs = charScene(() => buildChar(sp.hero, POSES.idle), sp.hero.kind === "mc" ? { pos: [0, 2.2, 7.6], look: [0, 2.0, 0], fov: 36 } : { pos: [0, 2.6, 12], look: [0, 2.3, 0], fov: 34 }, { rimA: 0xffd090, rimB: 0x9a7aff });
    return t => { ctx.putImageData(bg, 0, 0); cs.obj.rotation.y = t * Math.PI * 2; cs.obj.position.y = Math.sin(t * Math.PI * 4) * .06; ctx.drawImage(outlined(cs.render(), 10), 0, 0); text(sp.label, 60, 120, { font: "Luckiest Guy", size: 90, fill: ["#fff27a", "#ffb000"], strokes: [[12, "#111"]], rot: -4 }); };
  },
  async emote(sp) {
    paintWorld(sp.world, [0, 5, 16], false, 5); const bg = ctx.getImageData(0, 0, W, H);
    const cs = charScene(() => buildChar(sp.hero, POSES.idle), sp.hero.kind === "mc" ? { pos: [0, 2.3, 7.2], look: [0, 2.0, 0], fov: 36 } : { pos: [0, 2.7, 11.5], look: [0, 2.3, 0], fov: 34 }, { rimA: 0x66ccff, rimB: 0xffaa66 });
    const [la, ra, ll, rl] = limbs(cs.obj); const head = cs.obj.children.find(c => c.isMesh && c.position.y > 2.5);
    return t => {
      ctx.putImageData(bg, 0, 0); const a = t * Math.PI * 2;
      if (sp.move === "wave") { ra.rotation.z = -2.5 + Math.sin(a * 3) * .45; la.rotation.z = .15; cs.obj.rotation.y = Math.sin(a) * .2; }
      if (sp.move === "dance") { la.rotation.z = 1.2 + Math.sin(a * 2) * 1.1; ra.rotation.z = -1.2 + Math.sin(a * 2 + Math.PI) * 1.1; ll.rotation.x = Math.sin(a * 2) * .5; rl.rotation.x = -Math.sin(a * 2) * .5; cs.obj.rotation.y = Math.sin(a) * .6; cs.obj.position.y = Math.abs(Math.sin(a * 2)) * .35; }

      if (sp.move === "panic") { la.rotation.z = 2.7 + Math.sin(a * 6) * .2; ra.rotation.z = -2.7 + Math.sin(a * 6 + 1) * .2; cs.obj.position.x = Math.sin(a * 8) * .12; if (head) head.rotation.y = Math.sin(a * 4) * .35; }
      ctx.drawImage(outlined(cs.render(), 10), 0, 0);
      if (sp.label) text(sp.label, 60, 120, { font: "Luckiest Guy", size: 90, fill: ["#fff27a", "#ffb000"], strokes: [[12, "#111"]], rot: -4 });
    };
  },
  async vsintro(sp) {
    const L = charScene(() => { const a = buildChar(sp.left, POSES.angry); a.rotation.y = .3; return a; }, { pos: [-.3, 2.9, 8.5], look: [-.3, 2.65, 0], fov: 30 }, { rimA: 0x66aaff, rimB: 0x66aaff }).render();
    const Rr = charScene(() => { const a = buildChar(sp.right, POSES.cheer); a.rotation.y = -.3; return a; }, { pos: [.3, 2.9, 8.5], look: [.3, 2.65, 0], fov: 30 }, { rimA: 0xff6677, rimB: 0xff6677 }).render();

    return t => {

      ctx.save(); ctx.beginPath(); ctx.moveTo(W / 2 + 40, 0); ctx.lineTo(W, 0); ctx.lineTo(W, H); ctx.lineTo(W / 2 - 40, H); ctx.clip(); burst(1030, 360, "#ff2a3a", "#ff4d5b"); ctx.restore();

    };

      ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.lineWidth = 3; for (let x = -20; x < W; x += 64) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); } for (let y = 0; y < H; y += 64) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

/* ================= entry points ================= */
async function fontsReady() { await document.fonts.ready; await Promise.all(['40px "Luckiest Guy"', '40px "Lilita One"', "40px Anton", '40px "Orbitron"', '900 italic 40px "Rubik"'].map(f => document.fonts.load(f))); }
