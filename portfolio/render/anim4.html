const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

function track(keys, t, ease = easeInOut) {

  const guard = new THREE.Mesh(new THREE.BoxGeometry(.9, .18, .2), new THREE.MeshStandardMaterial({ color: 0x2a2232, metalness: .6, roughness: .35 })); const grip = new THREE.Mesh(new THREE.BoxGeometry(.16, .7, .16), new THREE.MeshStandardMaterial({ color: 0x3a2a18 })); grip.position.y = -.4;
  sword.add(bl, guard, grip); scene.add(sword);
  const camera = new THREE.PerspectiveCamera(30, W / H, .1, 200);
  const render = makeRenderer(scene, camera);
  sparks(90, [0, 0, W, H], ["#c08aff", "#ffb040", "#ffffff"]);
  return t => {
    const g = ctx.createRadialGradient(W / 2, H * .55, 40, W / 2, H * .55, 820); g.addColorStop(0, "#3a1f52"); g.addColorStop(.55, "#160c22"); g.addColorStop(1, "#07050b"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalCompositeOperation = "screen"; for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2 + t * .6; ctx.fillStyle = "rgba(176,106,255,.05)"; ctx.beginPath(); ctx.moveTo(W / 2, H * .55); ctx.lineTo(W / 2 + Math.cos(a) * 1400, H * .55 + Math.sin(a) * 1400); ctx.lineTo(W / 2 + Math.cos(a + .1) * 1400, H * .55 + Math.sin(a + .1) * 1400); ctx.fill(); } ctx.restore();
    drawSparks(t, DUR, "rise");
    // smooth turntable, eased so it lingers on the front
    const turn = t * Math.PI * 2 + .35 * Math.sin(t * Math.PI * 2);
    av.rotation.y = turn;
    // idle life: breathing, slight weight shift, head look
    if (P.torso) P.torso.scale.y = 1 + .012 * Math.sin(t * Math.PI * 6);
    av.position.y = .02 * Math.sin(t * Math.PI * 6);
    if (P.head) { P.head.rotation.y = .18 * Math.sin(t * Math.PI * 2 + 1); P.head.rotation.x = .05 * Math.sin(t * Math.PI * 4); }
    P.ra.rotation.z = -.14 - .05 * Math.sin(t * Math.PI * 6); P.la.rotation.z = .14 + .05 * Math.sin(t * Math.PI * 6);
    sword.position.set(1.55, 2.0 + .15 * Math.sin(t * Math.PI * 4), -1.3); sword.rotation.set(.1, t * Math.PI * 2, -.25);
    ring.material.color.setHSL(.75, 1, .55 + .15 * Math.sin(t * Math.PI * 8)); 
    const dist = lerp(9.4, 8.6, easeInOut(.5 + .5 * Math.sin(t * Math.PI * 2 - Math.PI / 2)));
    camera.position.set(-1.25 + .4 * Math.sin(t * Math.PI * 2), 2.2 + .15 * Math.sin(t * Math.PI * 2), dist); camera.lookAt(-1.25, 2.05, 0);
    rimA.target.position.set(0, 2, 0); rimB.target.position.set(0, 2, 0);
    ctx.drawImage(render(), 0, 0);
    vignette(.55);
    const k = clamp((t - .04) / .1), k2 = clamp((t - .12) / .1);
    if (k > 0) { ctx.save(); ctx.globalAlpha = k; text(sp.label, 70 - 60 * (1 - easeOutCubic(k)), 150, { font: "Anton", size: 104, fill: ["#ffffff", "#d8c8ff"], strokes: [[10, "#1a0a2a"]], rot: -3, drop: 8 }); ctx.restore(); }
    if (k2 > 0 && sp.sub) { ctx.save(); ctx.globalAlpha = k2; text(sp.sub, 76, 212, { font: "Lilita One", size: 40, fill: "#ffb040", strokes: [[5, "#1a0a2a"]], rot: -3, drop: 4 }); ctx.restore(); }
  };
}

async function fontsReady() { await document.fonts.ready; await Promise.all(['40px "Luckiest Guy"', '40px "Lilita One"', "40px Anton", '900 italic 40px "Rubik"'].map(f => document.fonts.load(f))); }
let draw = null;
window.setupAnim = async sp => { await fontsReady(); seed = sp.seed || 5; draw = await (sp.anim === "dance" ? setupDance(sp) : setupShowcase(sp)); return true; };
window.animFrame = t => { ctx.clearRect(0, 0, W, H); draw(t); return out.toDataURL("image/jpeg", .93); };
window.READY = true;
</script></body></html>
