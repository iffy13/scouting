name: Portfolio site

# Publishes the site/ folder to the gh-pages branch, which GitHub Pages serves at https://iffy13.github.io/scouting/
# Add a thumbnail by uploading an image (or mp4) to site/work or site/before-after; this runs by itself and the
# new piece is live a minute or two later.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/portfolio_site.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the gallery list
        run: python site/build.py
      - name: Push site/ to gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish portfolio site (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
