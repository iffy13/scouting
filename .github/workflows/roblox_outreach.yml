name: Roblox outreach

# Emails the leads found by the Roblox scout, from one of your connected mailboxes: replies and bounces checked first,
# then one follow up to people who did not answer after 4 days, then first emails up to the daily cap (15 by default),
# 4 to 9 minutes apart. Everything that was sent and every reply goes to your Telegram.
# Pause it: set the repository variable ROBLOX_OUTREACH_PAUSED to true.
on:
  schedule:
    - cron: "13 14 * * 1-6"   # 09:13 New York, 14:13 London, 15:13 Lagos
    - cron: "47 18 * * 1-6"   # 13:47 New York, 18:47 London, 19:47 Lagos
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show the emails, send nothing)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: roblox-scout          # same group as the scout, so the two never change the saved leads at the same time
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SENDER_NAME: ${{ secrets.SENDER_NAME }}
      POSTAL_ADDRESS: ${{ secrets.POSTAL_ADDRESS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MAILBOX_MAP_JSON: ${{ secrets.MAILBOX_MAP_JSON }}
      SMTP_ACCOUNTS_JSON: ${{ secrets.SMTP_ACCOUNTS_JSON }}
      ACCOUNT_WHATSAPP_JSON: ${{ secrets.ACCOUNT_WHATSAPP_JSON }}
      ACCOUNT_RECEPTIONIST_JSON: ${{ secrets.ACCOUNT_RECEPTIONIST_JSON }}
      ACCOUNT_BOOKS_JSON: ${{ secrets.ACCOUNT_BOOKS_JSON }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      DB_PASSPHRASE: ${{ secrets.DB_PASSPHRASE }}
      ROBLOX_MAILBOX: ${{ vars.ROBLOX_MAILBOX }}
      ROBLOX_DAILY_CAP: ${{ vars.ROBLOX_DAILY_CAP || '15' }}
      ROBLOX_PER_RUN: ${{ vars.ROBLOX_PER_RUN || '8' }}
      ROBLOX_OUTREACH_PAUSED: ${{ vars.ROBLOX_OUTREACH_PAUSED || 'false' }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Write mailbox files from secrets
        run: |
          printf '%s' "$MAILBOX_MAP_JSON" > mailbox_map.json
          python autopilot.py --prepare
      - name: Restore the saved leads
        uses: actions/cache/restore@v4
        with:
          path: roblox_scout_state
          key: roblox-scout-v2-${{ github.run_id }}
          restore-keys: roblox-scout-v2-
      - name: Find more email leads when fewer than 10 are waiting
        run: |
          n=$(python -c "import json;print(sum(1 for l in json.load(open('roblox_scout_state/email_leads.json')) if l.get('status','new')=='new'))" 2>/dev/null || echo 0)
          echo "Leads waiting: $n"
          if [ "$n" -lt 10 ]; then python roblox_scout.py --emails; fi
        env:
          TELEGRAM_BOT_TOKEN: ""   # no separate scout message here, the outreach report covers it
      - name: Send
        run: python roblox_outreach.py
      - name: Save the leads (also when something failed, so nobody is emailed twice)
        if: always() && inputs.dry_run != true
        uses: actions/cache/save@v4
        with:
          path: roblox_scout_state
          key: roblox-scout-v2-${{ github.run_id }}
