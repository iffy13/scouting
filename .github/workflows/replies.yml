name: Reply check

on:
  schedule:
    - cron: "47 * * * *"   # every hour, odd minute so GitHub does not drop it
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outreach-data
  cancel-in-progress: false

jobs:
  replies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DB_PASSPHRASE: ${{ secrets.DB_PASSPHRASE }}
      MAILBOX_MAP_JSON: ${{ secrets.MAILBOX_MAP_JSON }}
      SMTP_ACCOUNTS_JSON: ${{ secrets.SMTP_ACCOUNTS_JSON }}
      ACCOUNT_WHATSAPP_JSON: ${{ secrets.ACCOUNT_WHATSAPP_JSON }}
      ACCOUNT_RECEPTIONIST_JSON: ${{ secrets.ACCOUNT_RECEPTIONIST_JSON }}
      ACCOUNT_BOOKS_JSON: ${{ secrets.ACCOUNT_BOOKS_JSON }}
      DATA_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Write mailbox files from secrets
        run: |
          printf '%s' "$MAILBOX_MAP_JSON" > mailbox_map.json
          python autopilot.py --prepare
      - name: Restore database
        run: bash ci/data_sync.sh restore
      - name: Check replies
        run: python autopilot.py --replies-only
      - name: Save database
        if: always()
        run: bash ci/data_sync.sh save
