name: Scout leads

# Scouting and approval only, every 4 hours. Never sends emails.
#
# 1. cloud: scouts on GitHub's servers with the Serper API (SERPER_API_KEY secret).
# 2. pc:    only when the cloud job could not search (no key, or Serper credits used up), your own PC
#           (self-hosted runner) scouts with the free DuckDuckGo search. It works on a copy of the database
#           and never saves it, so it can wait for your PC to switch on without blocking outreach or replies.
# 3. merge: adds what the PC found to the saved database. A business already in it is skipped, nothing is overwritten.
on:
  schedule:
    - cron: "23 1-23/4 * * *"   # every 4 hours at odd times (01:23, 05:23 ...), clear of the sending runs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cloud:
    if: vars.OUTREACH_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: outreach-data
      cancel-in-progress: false
    outputs:
      fallback: ${{ steps.wa.outputs.fallback || steps.rc.outputs.fallback || steps.r3d.outputs.fallback || steps.lg.outputs.fallback }}
    env:
      BUSINESS_NAME: ${{ secrets.BUSINESS_NAME }}
      POSTAL_ADDRESS: ${{ secrets.POSTAL_ADDRESS }}
      SENDER_NAME: ${{ secrets.SENDER_NAME }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DB_PASSPHRASE: ${{ secrets.DB_PASSPHRASE }}
      MAILBOX_MAP_JSON: ${{ secrets.MAILBOX_MAP_JSON }}
      ACCOUNT_WHATSAPP_JSON: ${{ secrets.ACCOUNT_WHATSAPP_JSON }}
      ACCOUNT_RECEPTIONIST_JSON: ${{ secrets.ACCOUNT_RECEPTIONIST_JSON }}
      ACCOUNT_BOOKS_JSON: ${{ secrets.ACCOUNT_BOOKS_JSON }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      SERPER_MAX_QUERIES: ${{ vars.SERPER_MAX_QUERIES || '16' }}
      SCOUT_DAILY_CAP: ${{ vars.SCOUT_DAILY_CAP || '25' }}
      AP_SCOUT_MAX: ${{ vars.AP_SCOUT_MAX || '20' }}
      DEMO_LINK: ${{ vars.DEMO_LINK }}
      DATA_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Write mailbox files from secrets
        run: |
          printf '%s' "$MAILBOX_MAP_JSON" > mailbox_map.json
          python autopilot.py --prepare
      - name: Restore database
        id: restore
        run: bash ci/data_sync.sh restore
      - name: Scout whatsapp_api
        id: wa
        run: python autopilot.py --service whatsapp_api --scout-only
      - name: Scout receptionist
        id: rc
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: python autopilot.py --service receptionist --scout-only
      - name: Scout render_3d
        id: r3d
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: python autopilot.py --service render_3d --scout-only
      - name: Scout lead_gen
        id: lg
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: python autopilot.py --service lead_gen --scout-only
      - name: Save database
        if: always()
        run: bash ci/data_sync.sh save

  pc:
    needs: cloud
    if: needs.cloud.outputs.fallback == 'true'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 120
    concurrency:
      group: scout-pc
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DB_PASSPHRASE: ${{ secrets.DB_PASSPHRASE }}
      SCOUT_SOURCE: web
      SCOUT_DAILY_CAP: ${{ vars.SCOUT_DAILY_CAP || '25' }}
      AP_SCOUT_MAX: ${{ vars.AP_SCOUT_MAX || '20' }}
      DATA_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          python --version
          python -m pip install -q -r requirements.txt
      - name: Copy the saved database (read only, never saved from the PC)
        run: bash ci/data_sync.sh restore
      - name: Remember where new leads start
        run: python autopilot.py --mark
      - name: Scout whatsapp_api
        run: python autopilot.py --service whatsapp_api --scout-only
      - name: Scout receptionist
        if: ${{ !cancelled() }}
        run: python autopilot.py --service receptionist --scout-only
      - name: Scout render_3d
        if: ${{ !cancelled() }}
        run: python autopilot.py --service render_3d --scout-only
      - name: Scout lead_gen
        if: ${{ !cancelled() }}
        run: python autopilot.py --service lead_gen --scout-only
      - name: Export new leads (locked, artifacts of a public repo can be downloaded by anyone)
        if: ${{ !cancelled() }}
        run: |
          python autopilot.py --export-new new_leads.json
          bash ci/data_sync.sh encrypt-file new_leads.json new_leads.json.enc
          rm -f new_leads.json outreach.db
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pc-leads
          path: new_leads.json.enc
          retention-days: 1

  merge:
    needs: pc
    if: ${{ !cancelled() && needs.pc.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: outreach-data
      cancel-in-progress: false
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DB_PASSPHRASE: ${{ secrets.DB_PASSPHRASE }}
      DATA_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: pc-leads
      - name: Restore database
        run: bash ci/data_sync.sh restore
      - name: Add the PC's leads and approve
        run: |
          bash ci/data_sync.sh decrypt-file new_leads.json.enc new_leads.json
          python autopilot.py --import-leads new_leads.json
          python -c "import run_all; run_all.approve_all()"
      - name: Save database
        if: always()
        run: bash ci/data_sync.sh save
