name: Daily digest

# Sends the day's scouting and outreach news to Telegram once a day: a short summary plus the full file
# (every lead, hiring post and email sent). Urgent things (replies, sending stopped) are sent as they happen.
on:
  schedule:
    - cron: "7 19 * * *"   # about 20:07 Lagos time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-scout      # same group as the scout and outreach, so the digest file is never written while it is sent
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the saved state
        uses: actions/cache/restore@v4
        with:
          path: roblox_scout_state
          key: roblox-scout-v2-${{ github.run_id }}
          restore-keys: roblox-scout-v2-
      - name: Send the digest
        run: python digest.py --send
      - name: Save the state (digest cleared)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: roblox_scout_state
          key: roblox-scout-v2-${{ github.run_id }}
