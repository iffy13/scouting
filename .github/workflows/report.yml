name: Excel report

# Every morning, an Excel file with everyone scouted, emailed, followed up and every reply goes to your Telegram.
# Get one any time from your PC with:   gh workflow run report.yml
# Read only: it never saves the database and never uploads the file to GitHub (it holds email addresses).
on:
  schedule:
    - cron: "43 5 * * *"   # 06:43 Lagos time, every day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      BUSINESS_NAME: ${{ secrets.BUSINESS_NAME }}
      POSTAL_ADDRESS: ${{ secrets.POSTAL_ADDRESS }}
      SENDER_NAME: ${{ secrets.SENDER_NAME }}
      SENDER_TITLE: ${{ vars.SENDER_TITLE || 'Founder' }}
      WEBSITE_URL: ${{ vars.WEBSITE_URL }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DB_PASSPHRASE: ${{ secrets.DB_PASSPHRASE }}
      MAILBOX_MAP_JSON: ${{ secrets.MAILBOX_MAP_JSON }}
      DATA_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Restore database (read only)
        run: |
          printf '%s' "$MAILBOX_MAP_JSON" > mailbox_map.json
          bash ci/data_sync.sh restore
      - name: Build the report and send it to Telegram
        run: python report_excel.py --telegram --out "outreach_report_$(date -u +%Y-%m-%d).xlsx"
      - name: Delete the file from the runner
        if: always()
        run: rm -f outreach_report_*.xlsx outreach.db mailbox_map.json
